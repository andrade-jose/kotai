<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — KTI Tracker Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c10;--bg2:#0d1219;--border:#1e2d3d;--accent:#00e5a0;--text:#e8edf2;--text2:#7a8fa6;--red:#ff4d6d;--mono:'Space Mono',monospace;--sans:'Syne',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:0.25;pointer-events:none}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:380px;position:relative;z-index:1;text-align:center}
.logo{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:28px;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
h2{font-size:22px;font-weight:800;margin-bottom:8px}
.sub{font-size:14px;color:var(--text2);margin-bottom:32px;line-height:1.5}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s}
.google-btn:hover{border-color:var(--accent);color:var(--accent)}
.google-icon{width:20px;height:20px}
.error{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:20px}
.footer-note{font-family:var(--mono);font-size:10px;color:#3d5166;margin-top:24px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="dot"></div>KTI_TRACKER</div>
  <h2>Área restrita</h2>
  <p class="sub">Acesso exclusivo para administradores.<br>Faça login com sua conta Google autorizada.</p>
  <div id="error-msg" class="error" style="display:none">Conta não autorizada. Contate o administrador.</div>
  <a class="google-btn" href="/auth/google">
    <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Entrar com Google
  </a>
  <div class="footer-note">kotaitracker.online · admin</div>
</div>
<script>
  if (new URLSearchParams(location.search).get('erro') === 'nao_autorizado') {
    document.getElementById('error-msg').style.display = 'block';
  }
</script>
</body>
</html>
