<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTI Tracker — Kotai em tempo real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --bg2: #0d1219;
    --bg3: #131a23;
    --border: #1e2d3d;
    --border2: #243447;
    --accent: #00e5a0;
    --accent2: #00b37e;
    --text: #e8edf2;
    --text2: #7a8fa6;
    --text3: #3d5166;
    --red: #ff4d6d;
    --green: #00e5a0;
    --yellow: #f5c542;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* NAV */
  nav {
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
    position: sticky;
    top: 0;
    background: rgba(8,12,16,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 15px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.05em;
  }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    color: var(--text2); text-decoration: none; font-size: 13px;
    font-weight: 500; letter-spacing: 0.04em;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--accent); }
  .nav-badge {
    font-family: var(--mono); font-size: 12px; color: var(--accent2);
    border: 1px solid var(--border2); border-radius: 4px;
    padding: 4px 10px; letter-spacing: 0.03em;
  }

  /* HERO */
  .hero { padding: 64px 0 48px; }
  .hero-label {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .hero-label::before { content: ''; width: 24px; height: 1px; background: var(--accent); }
  .hero h1 {
    font-size: clamp(36px, 5vw, 64px); font-weight: 800;
    line-height: 1.05; letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .hero h1 span { color: var(--accent); }
  .hero-sub { font-size: 16px; color: var(--text2); max-width: 480px; line-height: 1.6; }

  /* STATS BAR */
  .stats-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; margin: 40px 0;
  }
  .stat-card {
    background: var(--bg2); padding: 20px 24px;
    transition: background 0.2s;
  }
  .stat-card:hover { background: var(--bg3); }
  .stat-label {
    font-family: var(--mono); font-size: 10px; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 8px;
  }
  .stat-value {
    font-family: var(--mono); font-size: 22px; font-weight: 700;
    color: var(--text); letter-spacing: -0.01em;
  }
  .stat-change {
    font-family: var(--mono); font-size: 11px; margin-top: 4px;
  }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .neutral { color: var(--text3); }

  /* MAIN GRID */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

  /* CARDS */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .card-title {
    font-family: var(--mono); font-size: 11px; color: var(--text2);
    text-transform: uppercase; letter-spacing: 0.1em;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before {
    content: ''; width: 3px; height: 12px;
    background: var(--accent); border-radius: 2px;
  }

  /* CONVERTER */
  .converter-wrap { display: flex; flex-direction: column; gap: 12px; }
  .conv-field {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    transition: border-color 0.2s;
  }
  .conv-field:focus-within { border-color: var(--accent); }
  .conv-tag {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--accent); background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.2);
    border-radius: 4px; padding: 3px 8px; white-space: nowrap;
  }
  .conv-tag.brl { color: var(--yellow); background: rgba(245,197,66,0.08); border-color: rgba(245,197,66,0.2); }
  .conv-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: var(--mono); font-size: 20px; font-weight: 700;
    color: var(--text); text-align: right; min-width: 0;
  }
  .conv-input::placeholder { color: var(--text3); }
  .swap-btn {
    align-self: center; width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg3); border: 1px solid var(--border2);
    color: var(--text2); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; margin: 0 auto;
  }
  .swap-btn:hover { border-color: var(--accent); color: var(--accent); transform: rotate(180deg); }
  .conv-rate {
    font-family: var(--mono); font-size: 11px; color: var(--text3);
    text-align: center; margin-top: 8px;
  }

  /* PORTFOLIO CALC */
  .portfolio-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .portfolio-input {
    flex: 1; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; padding: 12px 16px;
    font-family: var(--mono); font-size: 16px; font-weight: 700;
    color: var(--text); outline: none;
    transition: border-color 0.2s;
  }
  .portfolio-input:focus { border-color: var(--accent); }
  .portfolio-result {
    background: rgba(0,229,160,0.05); border: 1px solid rgba(0,229,160,0.15);
    border-radius: 8px; padding: 16px;
  }
  .portfolio-result-label { font-family: var(--mono); font-size: 10px; color: var(--accent2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .portfolio-result-val { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--accent); }
  .portfolio-result-usd { font-family: var(--mono); font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* CHART */
  .chart-wrap { position: relative; height: 180px; margin-top: 8px; }
  canvas#priceChart { width: 100% !important; height: 100% !important; }

  /* NEWS AI */
  .news-card { grid-column: 1 / -1; }
  .news-content {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 20px;
    font-size: 14px; line-height: 1.75; color: var(--text2);
    min-height: 80px;
  }
  .news-loading { display: flex; align-items: center; gap: 10px; color: var(--text3); font-family: var(--mono); font-size: 12px; }
  .news-loading::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    border: 2px solid var(--accent); border-top-color: transparent;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .news-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px;
  }
  .news-ts { font-family: var(--mono); font-size: 10px; color: var(--text3); }
  .refresh-btn {
    font-family: var(--mono); font-size: 11px; color: var(--accent2);
    background: transparent; border: 1px solid var(--border2);
    border-radius: 4px; padding: 5px 12px; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.05em;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* INFO STRIP */
  .info-strip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; margin: 20px 0 40px;
  }
  .info-item {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .info-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(0,229,160,0.08); border: 1px solid rgba(0,229,160,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; color: var(--accent);
  }
  .info-icon.yellow { background: rgba(245,197,66,0.08); border-color: rgba(245,197,66,0.15); color: var(--yellow); }
  .info-icon.red { background: rgba(255,77,109,0.08); border-color: rgba(255,77,109,0.15); color: var(--red); }
  .info-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .info-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border); padding: 24px 0;
    text-align: center; font-family: var(--mono); font-size: 11px;
    color: var(--text3); letter-spacing: 0.05em;
  }

  /* FADE IN */
  .fade-in { opacity: 0; transform: translateY(16px); animation: fadeIn 0.5s forwards; }
  @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
  .d1 { animation-delay: 0.1s; }
  .d2 { animation-delay: 0.2s; }
  .d3 { animation-delay: 0.3s; }
  .d4 { animation-delay: 0.4s; }
  .d5 { animation-delay: 0.5s; }
</style>
</head>
<body>

<nav>
  <div class="container">
    <div class="nav-inner">
      <div class="logo">
        <div class="logo-dot"></div>
        KTI_TRACKER
      </div>
      <div class="nav-links">
        <a href="#conversor">Conversor</a>
        <a href="#portfolio">Portfólio</a>
        <a href="#noticias">Notícias IA</a>
        <a href="#sobre">Sobre</a>
      </div>
      <div class="nav-badge" id="lastUpdate">atualizando...</div>
    </div>
  </div>
</nav>

<div class="container">

    <div class="hero-label">Kotai Token · KTI · BSC</div>
    <h1>Acompanhe o <span>KTI</span><br>em tempo real</h1>
